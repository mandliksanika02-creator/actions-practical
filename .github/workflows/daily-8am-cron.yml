name: Daily Cron Job

on:
  workflow_dispatch: 
  schedule:
    - cron: "30 2 * * *"

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job Started
        run: echo "Daily job has started!"

      - name: Display Date and Time
        run: date

      - name: Completion Message
        run: echo "Daily job completed successfully!"
